services:
  web:
    build: .
    restart: unless-stopped
    expose:
      - "80"
    environment:
      APP_NAME: "Klubové kartičky"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL:-https://karty.server.apartmanyzilina.sk}"
      APP_LOCALE: sk
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: karty
      DB_USERNAME: karty
      DB_PASSWORD: "${DB_PASSWORD}"
      SESSION_DRIVER: database
      SESSION_LIFETIME: "${SESSION_LIFETIME:-525600}"
      SESSION_SECURE_COOKIE: "true"
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      - mysql

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: karty
      MYSQL_USER: karty
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    volumes:
      - mysql:/var/lib/mysql

volumes:
  storage:
  mysql:
